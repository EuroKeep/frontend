<ng-container *transloco="let t">
    <c-row class="mt-3">
        <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4">
            @if (this.AuthenticationService.getUser().settings.helpDisplay && this.helpUrl.length > 0) {
                <a cButton size="sm" class="ripple" target="_blank" [href]="this.helpUrl" color="info">
                    <fa-icon [icon]="['fas', 'info-circle']" /> {{ t('Get help') }}
                </a>
            }
            <button cButton size="sm" class="ripple" [routerLink]="['/', 'mobile', 'settings']" color="dark">
                <fa-icon [icon]="['fas', 'arrow-left']"/> {{ t('Back') }}
            </button>
        </c-col>
        <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-center">
            <h5>{{t('Account types')}}</h5>
        </c-col>
        <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-end">
            <c-button-group>
                <button cButton size="sm" class="ripple" [routerLink]="['/', 'mobile', 'accounttype', 'add']" color="success">
                    {{ t('Create') }}
                    <fa-icon [icon]="['fas', 'plus']"/>
                </button>
            </c-button-group>
        </c-col>
    </c-row>
    @if (Items && Items.length === 0) {
        <c-row>
            <c-col class="text-center text-danger fst-italic pt-3 pb-3">
                {{ t('Begin by adding an account type.') }}
            </c-col>
        </c-row>
    }
    @for (Accounttype of Items; track Accounttype.id) {
        <c-card class="menuItem cursor-pointer mt-3" [routerLink]="['/', 'mobile', 'accounttype', 'edit', Accounttype.id]">
            <c-card-body class="p-2">
                <c-row>
                    <c-col>
                        {{ Accounttype.name }}
                    </c-col>
                    <c-col [xs]="'auto'" class="text-end">
                        <fa-icon [icon]="['fas', 'edit']" class="text-primary"/>
                    </c-col>
                </c-row>
            </c-card-body>
        </c-card>
    }
</ng-container>
