<ng-container *transloco="let t">
    <c-row class="mt-3">
        <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4">
            @if (this.AuthenticationService.getUser().settings.helpDisplay && this.helpUrl.length > 0) {
                <a cButton size="sm" class="ripple" target="_blank" [href]="this.helpUrl" color="info">
                    <fa-icon [icon]="['fas', 'info-circle']" /> {{ t('Get help') }}
                </a>
            }
        </c-col>
        <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-center">
            <h5>{{t('Piggybanks')}}</h5>
        </c-col>
        <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-end">
            <c-button-group>
                <button cButton size="sm" class="ripple" [routerLink]="['/', 'mobile', 'saving', 'add']" color="success">
                    {{ t('Create') }}
                    <fa-icon [icon]="['fas', 'plus']"/>
                </button>
            </c-button-group>
        </c-col>
    </c-row>
    @if (Piggybanks) {
        @for (Piggybank of Piggybanks; track Piggybank.id) {
            <piggybank-entry [Piggybank]="Piggybank" />
        }
    }
</ng-container>
