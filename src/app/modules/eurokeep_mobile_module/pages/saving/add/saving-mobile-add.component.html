<ng-container *transloco="let t">
    <form cForm (ngSubmit)="add()">
        <c-row class="mt-3">
            <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4">
                @if (this.AuthenticationService.getUser().settings.helpDisplay && this.helpUrl.length > 0) {
                    <a cButton size="sm" class="ripple" target="_blank" [href]="this.helpUrl" color="info">
                        <fa-icon [icon]="['fas', 'info-circle']" /> {{ t('Get help') }}
                    </a>
                }
                <button cButton size="sm" class="ripple" [routerLink]="['/', 'mobile', 'saving', 'list']" color="dark">
                    <fa-icon [icon]="['fas', 'arrow-left']"/> {{ t('Back') }}
                </button>
            </c-col>
            <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-center">
                <h5>{{t('Create Piggybank')}}</h5>
            </c-col>
            <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-end">
                <c-button-group>
                    <button cButton size="sm" [nSpamsaveButton]="IsWorking" class="ripple" color="success" type="submit">
                        {{ t('Save') }} <fa-icon [icon]="['fas', 'arrow-right']"/>
                    </button>
                </c-button-group>
            </c-col>
        </c-row>
        <c-card class="mt-3">
            <c-card-body>
                <c-row>
                    <c-col>

                        <nox-input
                                [errors]="errors"
                                [(value)]="post.name"
                                [type]="'text'"
                                [name]="'name'"
                                [label]="t('Name')"
                        />
                    </c-col>
                    <c-col>

                        <nox-select [errors]="errors"
                                    [(value)]="post.account_id"
                                    [name]="'transfer_id'"
                                    [Items]="Accounts"
                                    [label]="t('Piggybank account')"
                                    [placeholder]="t('Please select your savings account.')"
                        />
                    </c-col>
                </c-row>
                <c-row>
                    <c-col>

                        <nox-balance-input
                                [errors]="errors"
                                [Currency]="post.balance_currency"
                                [(value)]="post.target"
                                [type]="'number'"
                                [name]="'target'"
                                [label]="t('Target')"
                        />
                    </c-col>
                    <c-col>
                        <nox-select [errors]="errors"
                                    [(value)]="post.balance_currency"
                                    [name]="'balance_currency'"
                                    [Items]="Currencies"
                                    [label]="t('Currency')"
                                    [placeholder]="t('Please select a currency.')"
                                    name="post.balance_currency"
                                    [required]="true"/>

                    </c-col>
                </c-row>
                <c-row>
                    <c-col>

                        <nox-input
                                [errors]="errors"
                                [(value)]="post.start"
                                [type]="'date'"
                                [name]="'start'"
                                [label]="t('Start')"
                        />
                    </c-col>
                    <c-col>

                        <nox-input
                                [errors]="errors"
                                [(value)]="post.end"
                                [type]="'date'"
                                [name]="'end'"
                                [label]="t('End')"
                        />
                    </c-col>
                </c-row>
                <nox-balance-input
                        [errors]="errors"
                        [Currency]="post.balance_currency"
                        [(value)]="post.balance_value"
                        [type]="'number'"
                        [name]="'balance_value'"
                        [label]="t('Value')"
                />
                <nox-input
                        [errors]="errors"
                        [(value)]="post.description"
                        [type]="'text'"
                        [name]="'description'"
                        [label]="t('Description')"
                />
            </c-card-body>
        </c-card>
    </form>
</ng-container>
