<ng-container *transloco="let t">
    <form cForm (ngSubmit)="edit()">
        <c-row class="mt-3">
            <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4">
                @if (this.AuthenticationService.getUser().settings.helpDisplay && this.helpUrl.length > 0) {
                    <a cButton size="sm" class="ripple" target="_blank" [href]="this.helpUrl" color="info">
                        <fa-icon [icon]="['fas', 'info-circle']" /> {{ t('Get help') }}
                    </a>
                }
                <button cButton size="sm" class="ripple" [routerLink]="['/', 'mobile', 'account', 'list']" color="dark">
                    <fa-icon [icon]="['fas', 'arrow-left']"/> {{ t('Back') }}
                </button>
            </c-col>
            <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-center">
                <h5>{{t('Edit Account')}}</h5>
            </c-col>
            <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-end">
                <c-button-group>
                    <button cButton size="sm" class="ripple" [nSpamsaveButton]="IsWorking" color="success" type="submit">
                        {{ t('Save') }} <fa-icon [icon]="['fas', 'arrow-right']"/>
                    </button>
                </c-button-group>
            </c-col>
        </c-row>
        <c-card class="mt-3">
            <c-card-body>
                <c-row>
                    <c-col [xs]="2" [sm]="2" [md]="2" [lg]="2" [xl]="2" [xxl]="2">
                        <nox-input
                                [errors]="errors"
                                [(value)]="post.emoji"
                                [type]="'text'"
                                [name]="'emoji'"
                                [label]="t('Emoji')"
                                [required]="true"
                        />
                    </c-col>
                    <c-col>
                        <nox-input
                                [errors]="errors"
                                [(value)]="post.name"
                                [type]="'text'"
                                [name]="'name'"
                                [label]="t('Title')"
                                [required]="true"
                        />
                    </c-col>
                </c-row>
                <c-row>
                    <c-col>
                        <nox-select [errors]="errors"
                                    [(value)]="post.balance_currency"
                                    [name]="'balance_currency'"
                                    [Items]="Currencies"
                                    [optionLabel]="currencyOptionLabel"
                                    [label]="t('Currency')"
                                    [placeholder]="t('Please select a currency.')"
                                    name="post.balance_currency"
                                    [required]="true">
                        </nox-select>
                    </c-col>
                    <c-col>

                        <nox-input
                                [errors]="errors"
                                [(value)]="post.iban"
                                [type]="'text'"
                                [name]="'iban'"
                                [label]="t('IBAN')"
                        />
                    </c-col>
                </c-row>
                <nox-select [errors]="errors"
                            [(value)]="post.accounttype_id"
                            [name]="'accounttype_id'"
                            [Items]="Accounttypes"
                            [label]="t('Account type')"
                            [placeholder]="t('Please select an account type.')"
                            name="post.accounttype_id"
                            [required]="true">
                </nox-select>
            </c-card-body>
            <c-card-footer>
                <button size="sm" cButton type="button" [nSpamsaveButton]="IsWorking" (click)="delete()" class="ripple" color="danger">
                    <fa-icon [icon]="['fas', 'trash']" /> {{ t('Delete') }}
                </button>
            </c-card-footer>
        </c-card>
    </form>
</ng-container>
