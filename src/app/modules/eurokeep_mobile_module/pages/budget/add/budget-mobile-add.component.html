<ng-container *transloco="let t">
    <form cForm (ngSubmit)="add()">
        <c-row class="mt-3">
            <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4">
                @if (this.AuthenticationService.getUser().settings.helpDisplay && this.helpUrl.length > 0) {
                    <a cButton size="sm" class="ripple" target="_blank" [href]="this.helpUrl" color="info">
                        <fa-icon [icon]="['fas', 'info-circle']" /> {{ t('Get help') }}
                    </a>
                }
                <button cButton size="sm" class="ripple" [routerLink]="['/', 'mobile', 'budget', 'list']" color="dark">
                    <fa-icon [icon]="['fas', 'arrow-left']"/> {{ t('Back') }}
                </button>
            </c-col>
            <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-center">
                <h5>{{t('Add Budget')}}</h5>
            </c-col>
            <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-end">
                <c-button-group>
                    <button cButton size="sm" class="ripple" [nSpamsaveButton]="IsWorking" color="success" type="submit">
                        {{ t('Save') }} <fa-icon [icon]="['fas', 'arrow-right']"/>
                    </button>
                </c-button-group>
            </c-col>
        </c-row>
        <c-card class="mt-3">
            <c-card-body>
                <c-row>
                    <c-col>
                        <nox-input
                                [errors]="errors"
                                [(value)]="post.name"
                                [type]="'text'"
                                [name]="'name'"
                                [label]="t('Title')"
                                [required]="true"
                        />
                    </c-col>
                    <c-col>

                        <nox-select [errors]="errors"
                                    [(value)]="post.category_id"
                                    [name]="'category_id'"
                                    [Items]="Categories"
                                    [label]="t('Category')"
                                    [placeholder]="t('Please select a category.')"
                                    name="category_id"
                                    [required]="true"
                        />
                    </c-col>
                </c-row>
                <c-row>
                    <c-col>

                        <nox-input
                                [errors]="errors"
                                [(value)]="post.limit"
                                [type]="'number'"
                                [name]="'limit'"
                                [label]="t('Limit')"
                                [required]="true"
                        />
                    </c-col>
                    <c-col>

                        <nox-select [errors]="errors"
                                    [(value)]="post.currency"
                                    [name]="'currency'"
                                    [Items]="Currencies"
                                    [label]="t('Currency')"
                                    [placeholder]="t('Please select a currency.')"
                                    name="currency"
                                    [required]="true"
                        />
                    </c-col>
                </c-row>
            </c-card-body>
        </c-card>
    </form>
</ng-container>
