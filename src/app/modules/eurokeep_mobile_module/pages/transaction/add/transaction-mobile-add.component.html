<ng-container *transloco="let t">
    @if (Account) {
        <form cForm (ngSubmit)="add()">
            <c-row class="mt-3">
                <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4">
                    @if (this.AuthenticationService.getUser().settings.helpDisplay && this.helpUrl.length > 0) {
                        <a cButton size="sm" class="ripple" target="_blank" [href]="this.helpUrl" color="info">
                            <fa-icon [icon]="['fas', 'info-circle']" /> {{ t('Get help') }}
                        </a>
                    }
                    <button cButton size="sm" class="ripple" [routerLink]="['/', 'mobile', 'transaction', 'stream', accountId]" color="dark">
                        <fa-icon [icon]="['fas', 'arrow-left']"/> {{ t('Back') }}
                    </button>
                </c-col>
                <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-center">
                    <h5>{{t('Create Transaction')}}</h5>
                </c-col>
                <c-col [xs]="4" [sm]="4" [md]="4" [lg]="4" [xl]="4" [xxl]="4" class="text-end">
                    <c-button-group>
                        <button cButton size="sm" class="ripple" [nSpamsaveButton]="IsWorking" color="success" type="submit">
                            {{ t('Save') }} <fa-icon [icon]="['fas', 'arrow-right']"/>
                        </button>
                    </c-button-group>
                </c-col>
            </c-row>
            <account-entry
                    [Account]="Account"
                    [EditUrl]="['/', 'mobile', 'account', 'edit', Account.id.toString()]"
            />
            <c-card class="mt-3">
                <c-card-body>
                    <c-row>
                        <c-col>
                            <nox-input
                                    [errors]="errors"
                                    [(value)]="post.comment"
                                    [type]="'text'"
                                    [name]="'comment'"
                                    [label]="t('Comment')"
                                    (onChange)="findCategory(post.comment)"
                                    (keyup)="findComment(post.comment)"
                                    [required]="true"
                            ></nox-input>
                        </c-col>
                        <c-col>
                            <nox-select [errors]="errors"
                                        [(value)]="post.category_id"
                                        [name]="'category_id'"
                                        [Items]="Categories"
                                        [optionLabel]="categoryOptionLabel"
                                        [selectedLabel]="categoryOptionLabel"
                                        [label]="t('Category')"
                                        [placeholder]="t('Please select a category.')"
                                        name="post.category_id"
                                        [required]="true">
                            </nox-select>
                        </c-col>
                    </c-row>
                    @if (foundTransaction) {
                        <button cButton type="button" color="success" class="btn-xs" (click)="applyFoundComment()">
                            {{ t('Do you mean') }}: {{ foundTransaction.comment }}
                        </button>
                    }
                    <nox-balance-input
                            [errors]="errors"
                            [Currency]="Account.balance_currency"
                            [(value)]="post.balance_value"
                            [type]="'number'"
                            [name]="'balance_value'"
                            id="balance_value"
                            [label]="t('Value')"
                            [required]="true"
                    ></nox-balance-input>
                    <c-row>
                        <c-col>
                            <nox-select [errors]="errors"
                                        [(value)]="post.subscription_id"
                                        [name]="'subscription_id'"
                                        [Items]="Subscriptions"
                                        [label]="t('Subscription')"
                                        [placeholder]="t('Map transaction to a Subscription.')"
                                        name="post.subscription_id"/>
                        </c-col>
                        <c-col>
                            <nox-select [errors]="errors"
                                        [(value)]="post.transfer_id"
                                        [name]="'transfer_id'"
                                        [Items]="Accounts"
                                        [label]="t('Transfer Account')"
                                        [placeholder]="t('Transfer to another account.')"
                                        name="post.transfer_id">
                            </nox-select>
                        </c-col>
                    </c-row>
                </c-card-body>
            </c-card>
        </form>
    }
</ng-container>
